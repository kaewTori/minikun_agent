spring.application.name=minikun_agent

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/minikun}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:minikun}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.ai.chat.memory.max-messages=${SPRING_AI_CHAT_MEMORY_MAX_MESSAGES:20}

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:memory-schema.sql

minikun.memory.minimum-confidence=${MINIKUN_MEMORY_MINIMUM_CONFIDENCE:0.7}
minikun.memory.maximum-content-length=${MINIKUN_MEMORY_MAXIMUM_CONTENT_LENGTH:500}
minikun.memory.llama-cpp.url=${MINIKUN_MEMORY_LLAMA_CPP_URL:http://z-flip:8080/v1/chat/completions}
minikun.memory.llama-cpp.model=${MINIKUN_MEMORY_LLAMA_CPP_MODEL:${OLLAMA_MODEL:hf.co/llmfan46/gemma-4-E4B-it-ultra-uncensored-heretic-GGUF:Q6_K}}
minikun.memory.llama-cpp.timeout=${MINIKUN_MEMORY_LLAMA_CPP_TIMEOUT:150s}

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:hf.co/llmfan46/gemma-4-E4B-it-ultra-uncensored-heretic-GGUF:Q6_K}
spring.ai.ollama.chat.options.num-ctx=${OLLAMA_NUM_CTX:16384}
spring.ai.ollama.embedding.options.model=${EMBEDDING_MODEL:nomic-embed-text}
