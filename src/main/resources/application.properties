# Feature toggles
minikun.search.enabled=${MINIKUN_SEARCH_ENABLED:true}
minikun.search.cache.enabled=${MINIKUN_SEARCH_CACHE_ENABLED:true}
minikun.memory.reflection.enabled=${MINIKUN_MEMORY_REFLECTION_ENABLED:true}
minikun.knowledge-ranking.ai.enabled=${MINIKUN_KNOWLEDGE_RANKING_AI_ENABLED:true}
minikun.knowledge-relevance.enabled=${MINIKUN_KNOWLEDGE_RELEVANCE_ENABLED:true}
minikun.knowledge-relevance.ai.enabled=${MINIKUN_KNOWLEDGE_RELEVANCE_AI_ENABLED:true}
minikun.knowledge-selection.memory.enabled=${MINIKUN_KNOWLEDGE_SELECTION_MEMORY_ENABLED:true}
minikun.knowledge-selection.search.enabled=${MINIKUN_KNOWLEDGE_SELECTION_SEARCH_ENABLED:true}
minikun.diagnostics.conversational.enabled=${MINIKUN_DIAGNOSTICS_CONVERSATIONAL_ENABLED:true}
minikun.browser.enabled=${MINIKUN_BROWSER_ENABLED:true}
minikun.tools.enabled=${MINIKUN_TOOLS_ENABLED:false}
minikun.token-budget.dynamic-enabled=${MINIKUN_TOKEN_BUDGET_DYNAMIC_ENABLED:false}

# Domain
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
minikun.model.tinygrad.base-url=${MINIKUN_TINYGRAD_BASE_URL:http://localhost:8001/v1}
minikun.search.searxng.url=${MINIKUN_SEARCH_SEARXNG_URL:http://127.0.0.1:8888}
minikun.browser.worker-url=${MINIKUN_BROWSER_WORKER_URL:http://127.0.0.1:3001}
minikun.model.task.provider=${MINIKUN_MODEL_TASK_PROVIDER:ollama}
minikun.model.task.ollama.base-url=${MINIKUN_MODEL_TASK_OLLAMA_BASE_URL:http://127.0.0.1:11434}
minikun.model.task.ollama.model=${MINIKUN_MODEL_TASK_OLLAMA_MODEL:hf.co/unsloth/Qwen3-0.6B-GGUF:UD-Q4_K_XL}
minikun.model.task.ollama.timeout=${MINIKUN_MODEL_TASK_OLLAMA_TIMEOUT:PT120S}

# Application
spring.application.name=minikun_agent
server.port=${SERVER_PORT:8080}

# Management
management.endpoints.web.exposure.include=health,metrics

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/minikun}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:minikun}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# SQL initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:memory-schema.sql

# Spring AI chat memory
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.ai.chat.memory.max-messages=${SPRING_AI_CHAT_MEMORY_MAX_MESSAGES:10}

# Memory
minikun.memory.minimum-confidence=${MINIKUN_MEMORY_MINIMUM_CONFIDENCE:0.7}
minikun.memory.maximum-content-length=${MINIKUN_MEMORY_MAXIMUM_CONTENT_LENGTH:500}
minikun.memory.recall.maximum-count=${MINIKUN_MEMORY_RECALL_MAXIMUM_COUNT:10}
minikun.memory.recall.maximum-characters=${MINIKUN_MEMORY_RECALL_MAXIMUM_CHARACTERS:4000}
minikun.memory.retrieval.max-candidates=${MINIKUN_MEMORY_RETRIEVAL_MAX_CANDIDATES:${MINIKUN_MEMORY_RECALL_MAXIMUM_COUNT:10}}
minikun.memory.main-model.timeout=${MINIKUN_MEMORY_MAIN_MODEL_TIMEOUT:240s}
minikun.memory.model=${MINIKUN_MEMORY_MODEL:${OLLAMA_MODEL:hf.co/mradermacher/llama3.2-typhoon2-3b-GGUF:Q4_K_M}}
minikun.memory.reflection.connect-timeout=${MINIKUN_MEMORY_REFLECTION_CONNECT_TIMEOUT:PT5S}
minikun.memory.reflection.read-timeout=${MINIKUN_MEMORY_REFLECTION_READ_TIMEOUT:PT120S}

# Ollama
spring.ai.ollama.chat.options.model=${SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL:hf.co/llmfan46/gemma-4-E4B-it-ultra-uncensored-heretic-GGUF:Q5_K_M}
spring.ai.ollama.chat.options.num-ctx=${OLLAMA_NUM_CTX:8192}
# spring.ai.ollama.chat.options.num-ctx=${OLLAMA_NUM_CTX:4096}
spring.ai.ollama.embedding.options.model=${EMBEDDING_MODEL:nomic-embed-text}

# tinygrad
## existing or tinygrad
minikun.model.active=${MINIKUN_MODEL_ACTIVE:tinygrad}
minikun.model.tinygrad.model=${MINIKUN_TINYGRAD_MODEL:fix}
minikun.model.tinygrad.timeout=${MINIKUN_TINYGRAD_TIMEOUT:PT300S}
minikun.model.generation.temperature=${MINIKUN_MODEL_GENERATION_TEMPERATURE:0.5}
minikun.model.generation.max-tokens=${MINIKUN_MODEL_GENERATION_MAX_TOKENS:2048}

# Title generation task model
minikun.model.title.provider=${MINIKUN_MODEL_TITLE_PROVIDER:ollama}

# Search
minikun.search.searxng.timeout=${MINIKUN_SEARCH_SEARXNG_TIMEOUT:10s}
minikun.search.max-retries=${MINIKUN_SEARCH_MAX_RETRIES:1}
minikun.search.timeout=${MINIKUN_SEARCH_TIMEOUT:10s}
minikun.search.maximum-characters=${MINIKUN_SEARCH_MAXIMUM_CHARACTERS:4000}
minikun.search.cache.ttl=${MINIKUN_SEARCH_CACHE_TTL:PT5M}
minikun.search.safesearch=${MINIKUN_SEARCH_SAFESEARCH:false}
minikun.search.query-planning.enabled=${MINIKUN_SEARCH_QUERY_PLANNING_ENABLED:true}
minikun.search.query-planning.max-alternates=${MINIKUN_SEARCH_QUERY_PLANNING_MAX_ALTERNATES:2}
minikun.search.cache.provider-version=${MINIKUN_SEARCH_CACHE_PROVIDER_VERSION:v1}

# Search decision
minikun.search.decision.mode=${MINIKUN_SEARCH_DECISION_MODE:llm}
minikun.search.decision.connect-timeout=${MINIKUN_SEARCH_DECISION_CONNECT_TIMEOUT:PT5S}
minikun.search.decision.read-timeout=${MINIKUN_SEARCH_DECISION_READ_TIMEOUT:PT120S}

# Knowledge ranking, relevance, and selection
minikun.knowledge-relevance.minimum-score=${MINIKUN_KNOWLEDGE_RELEVANCE_MINIMUM_SCORE:0.0}
minikun.knowledge-selection.memory.max-candidates=${MINIKUN_KNOWLEDGE_SELECTION_MEMORY_MAX_CANDIDATES:2147483647}
minikun.knowledge-selection.memory.max-characters=${MINIKUN_KNOWLEDGE_SELECTION_MEMORY_MAX_CHARACTERS:2147483647}
minikun.knowledge-selection.search.max-candidates=${MINIKUN_KNOWLEDGE_SELECTION_SEARCH_MAX_CANDIDATES:2147483647}
minikun.knowledge-selection.search.max-characters=${MINIKUN_KNOWLEDGE_SELECTION_SEARCH_MAX_CHARACTERS:2147483647}
minikun.knowledge-selection.browser.enabled=${MINIKUN_KNOWLEDGE_SELECTION_BROWSER_ENABLED:true}
minikun.knowledge-selection.browser.max-candidates=${MINIKUN_KNOWLEDGE_SELECTION_BROWSER_MAX_CANDIDATES:2147483647}
minikun.knowledge-selection.browser.max-characters=${MINIKUN_KNOWLEDGE_SELECTION_BROWSER_MAX_CHARACTERS:2147483647}

# Runtime cache
minikun.runtime.cache.backend=${MINIKUN_CACHE_BACKEND:valkey}

# Browser
minikun.browser.worker-token=${MINIKUN_BROWSER_WORKER_TOKEN:}
minikun.browser.timeout=${MINIKUN_BROWSER_TIMEOUT:20s}
minikun.browser.max-urls=${MINIKUN_BROWSER_MAX_URLS:5}
