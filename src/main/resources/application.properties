minikun.voice.tts.hf-home=/Volumes/minikun/homelab/tts/cache/huggingface
minikun.voice.tts.host=127.0.0.1
minikun.voice.tts.port=18021
minikun.voice.tts.auto-start=true
minikun.voice.tts.device=auto
minikun.voice.tts.startup-timeout=180s
minikun.voice.tts.cfg-value=2.5
minikun.voice.tts.timesteps=10
minikun.voice.tts.log=/Volumes/minikun/homelab/tts/logs/siangtts.log
minikun.voice.tts.say=/usr/bin/say
minikun.voice.tts.timeout=180s
minikun.voice.tts.vanira.python=/Volumes/minikun/homelab/tts/venv/bin/python
minikun.voice.tts.vanira.server-script=${MINIKUN_VOICE_TTS_VANIRA_SERVER_SCRIPT:/Volumes/minikun/homelab/java/minikun_agent/src/main/python/vanira_server.py}
minikun.voice.tts.vanira.working-directory=/Volumes/minikun/homelab/tts
minikun.voice.tts.vanira.model-path=/Volumes/minikun/homelab/tts/models/VaniraTTS
minikun.voice.tts.kokoro.model-path=${MINIKUN_VOICE_TTS_KOKORO_MODEL_PATH:/Volumes/minikun/homelab/tts/models/Kokoro-82M}
minikun.voice.tts.kokoro.voice=${MINIKUN_VOICE_TTS_KOKORO_VOICE:/Volumes/minikun/homelab/tts/models/Kokoro-82M/voices/am_michael.pt}
minikun.voice.tts.vanira.host=127.0.0.1
minikun.voice.tts.vanira.port=18022
minikun.voice.tts.vanira.auto-start=true
minikun.voice.tts.vanira.warmup=${MINIKUN_VOICE_TTS_WARMUP:false}
minikun.voice.tts.vanira.startup-timeout=60s
minikun.voice.tts.vanira.timeout=60s
minikun.voice.tts.vanira.log=/Volumes/minikun/homelab/tts/logs/vaniratts.log
minikun.voice.voices=${MINIKUN_VOICE_VOICES:minikun=3,male=3,male2=4}
minikun.voice.default-voice=minikun
minikun.voice.max-input-bytes=10485760
minikun.voice.max-output-bytes=8388608
minikun.voice.max-text-characters=4000
minikun.voice.max-prompt-characters=500
minikun.voice.max-concurrent-transcriptions=1
minikun.voice.max-concurrent-syntheses=2
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Personal Knowledge. Only relative UTF-8 text files inside these named roots can be indexed.
minikun.personal-knowledge.enabled=true
minikun.personal-knowledge.roots=knowledge=${user.home}/Documents/Minikun Knowledge
minikun.personal-knowledge.owner-id=default
minikun.personal-knowledge.max-file-bytes=2097152
minikun.personal-knowledge.max-files=500
minikun.personal-knowledge.max-depth=8
minikun.personal-knowledge.chunk.characters=1200
minikun.personal-knowledge.chunk.overlap=160
minikun.personal-knowledge.retrieval.max-candidates=2000
minikun.personal-knowledge.retrieval.minimum-score=0.65
minikun.personal-knowledge.auto-recall-limit=5
minikun.personal-knowledge.semantic.weight=0.85
minikun.personal-knowledge.monitor.enabled=true
minikun.personal-knowledge.monitor.initial-delay-ms=120000
minikun.personal-knowledge.monitor.poll-interval-ms=300000
minikun.personal-knowledge.management.token=${MINIKUN_KNOWLEDGE_MANAGEMENT_TOKEN:${MINIKUN_MEMORY_MANAGEMENT_TOKEN:}}

# Autonomous knowledge acquisition. Topics are researched on a bounded schedule;
# only rendered, corroborated claims are published into chat retrieval.
minikun.knowledge-acquisition.enabled=${MINIKUN_KNOWLEDGE_ACQUISITION_ENABLED:true}
minikun.knowledge-acquisition.owner-id=${MINIKUN_KNOWLEDGE_ACQUISITION_OWNER_ID:default}
minikun.knowledge-acquisition.management.token=${MINIKUN_KNOWLEDGE_ACQUISITION_TOKEN:${MINIKUN_KNOWLEDGE_MANAGEMENT_TOKEN:${MINIKUN_MEMORY_MANAGEMENT_TOKEN:}}}
minikun.knowledge-acquisition.scheduler.enabled=${MINIKUN_KNOWLEDGE_ACQUISITION_SCHEDULER_ENABLED:true}
minikun.knowledge-acquisition.scheduler.poll-interval-ms=${MINIKUN_KNOWLEDGE_ACQUISITION_POLL_INTERVAL_MS:300000}
minikun.knowledge-acquisition.scheduler.topics-per-run=${MINIKUN_KNOWLEDGE_ACQUISITION_TOPICS_PER_RUN:1}
minikun.knowledge-acquisition.run.timeout=${MINIKUN_KNOWLEDGE_ACQUISITION_TIMEOUT:PT60S}
minikun.knowledge-acquisition.run.result-limit=${MINIKUN_KNOWLEDGE_ACQUISITION_RESULT_LIMIT:8}
minikun.knowledge-acquisition.run.source-read-limit=${MINIKUN_KNOWLEDGE_ACQUISITION_SOURCE_READ_LIMIT:5}
minikun.knowledge-acquisition.safe-search=${MINIKUN_KNOWLEDGE_ACQUISITION_SAFE_SEARCH:true}
minikun.knowledge-acquisition.verification.minimum-confidence=${MINIKUN_KNOWLEDGE_ACQUISITION_MINIMUM_CONFIDENCE:0.7}
minikun.knowledge-acquisition.retrieval.max-candidates=${MINIKUN_KNOWLEDGE_ACQUISITION_RETRIEVAL_MAX_CANDIDATES:2000}
minikun.knowledge-acquisition.retrieval.semantic-weight=${MINIKUN_KNOWLEDGE_ACQUISITION_SEMANTIC_WEIGHT:0.85}
minikun.knowledge-acquisition.retrieval.minimum-score=${MINIKUN_KNOWLEDGE_ACQUISITION_MINIMUM_SCORE:0.55}

# Adaptive Companion learns only bounded response-style defaults. It stores
# aggregated evidence and never stores raw chat messages.
minikun.adaptation.enabled=true
minikun.adaptation.minimum-observations=3
minikun.adaptation.minimum-score=0.6
minikun.adaptation.evidence-max-age=365d
minikun.adaptation.management.token=${MINIKUN_ADAPTATION_MANAGEMENT_TOKEN:${MINIKUN_MEMORY_MANAGEMENT_TOKEN:}}

# Draft-only Communication Assistant. It uses the active local chat model and
# never stores, sends, or publishes generated content.
minikun.communication.enabled=true
minikun.communication.max-input-characters=12000
minikun.communication.max-output-characters=16000
minikun.communication.max-output-tokens=1600
minikun.communication.management.token=${MINIKUN_COMMUNICATION_MANAGEMENT_TOKEN:${MINIKUN_MEMORY_MANAGEMENT_TOKEN:}}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/minikun}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:minikun}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
# A lost local container must fail fast so fail-open request paths can continue in memory.
spring.datasource.hikari.connection-timeout=${MINIKUN_DATABASE_CONNECTION_TIMEOUT_MS:2000}
spring.datasource.hikari.validation-timeout=${MINIKUN_DATABASE_VALIDATION_TIMEOUT_MS:1000}
spring.datasource.hikari.initialization-fail-timeout=-1

# SQL initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:memory-schema.sql,classpath:planner-schema.sql,classpath:personal-knowledge-schema.sql,classpath:knowledge-acquisition-schema.sql,classpath:investment-schema.sql,classpath:personal-loop-schema.sql,classpath:chat-sync-schema.sql

# Passwordless device pairing and server-side Cockpit conversation sync.
minikun.sync.enabled=${MINIKUN_SYNC_ENABLED:true}
minikun.sync.owner-id=${MINIKUN_SYNC_OWNER_ID:default}
minikun.sync.canonical-origin=${MINIKUN_SYNC_CANONICAL_ORIGIN:https://mini-kun:8443}
minikun.sync.pairing-ttl=${MINIKUN_SYNC_PAIRING_TTL:PT2M}
minikun.sync.session-ttl=${MINIKUN_SYNC_SESSION_TTL:P180D}

# Closed-loop personal agent: weekly review, outcomes, experiments, inbox,
# automations, incident correlation, explainability, and personal timeline.
minikun.personal-loop.enabled=${MINIKUN_PERSONAL_LOOP_ENABLED:true}
minikun.personal-loop.owner-id=${MINIKUN_PERSONAL_LOOP_OWNER_ID:default}
minikun.personal-loop.timezone=${MINIKUN_PERSONAL_LOOP_TIMEZONE:Asia/Bangkok}
minikun.personal-loop.weekly-review.enabled=${MINIKUN_WEEKLY_REVIEW_ENABLED:true}
minikun.personal-loop.weekly-review.day=${MINIKUN_WEEKLY_REVIEW_DAY:SUNDAY}
minikun.personal-loop.weekly-review.time=${MINIKUN_WEEKLY_REVIEW_TIME:19:00}
minikun.personal-loop.automation.enabled=${MINIKUN_AUTOMATION_ENABLED:true}
minikun.personal-loop.automation.poll-interval-ms=${MINIKUN_AUTOMATION_POLL_INTERVAL_MS:60000}
minikun.personal-loop.incident.enabled=${MINIKUN_INCIDENT_COMMANDER_ENABLED:true}
minikun.personal-loop.incident.poll-interval-ms=${MINIKUN_INCIDENT_POLL_INTERVAL_MS:60000}
minikun.personal-loop.management.token=${MINIKUN_PERSONAL_LOOP_TOKEN:${MINIKUN_MEMORY_MANAGEMENT_TOKEN:}}

# Owner-scoped investment ledger and decision journal. Phase one is single-currency,
# with external market data and paper-broker adapters kept separately from the ledger.
minikun.investment.enabled=${MINIKUN_INVESTMENT_ENABLED:true}
minikun.investment.default-base-currency=${MINIKUN_INVESTMENT_DEFAULT_BASE_CURRENCY:THB}
