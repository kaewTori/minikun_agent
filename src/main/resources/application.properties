# Feature toggles
minikun.search.enabled=${MINIKUN_SEARCH_ENABLED:true}
minikun.search.cache.enabled=${MINIKUN_SEARCH_CACHE_ENABLED:true}
minikun.memory.reflection.enabled=${MINIKUN_MEMORY_REFLECTION_ENABLED:true}
minikun.knowledge-ranking.ai.enabled=${MINIKUN_KNOWLEDGE_RANKING_AI_ENABLED:false}
minikun.knowledge-relevance.enabled=${MINIKUN_KNOWLEDGE_RELEVANCE_ENABLED:true}
minikun.knowledge-relevance.ai.enabled=${MINIKUN_KNOWLEDGE_RELEVANCE_AI_ENABLED:false}
minikun.knowledge-relevance.ai.minimum-candidates=${MINIKUN_KNOWLEDGE_RELEVANCE_AI_MINIMUM_CANDIDATES:6}
minikun.knowledge-ranking.ai.minimum-candidates=${MINIKUN_KNOWLEDGE_RANKING_AI_MINIMUM_CANDIDATES:6}
minikun.knowledge-selection.memory.enabled=${MINIKUN_KNOWLEDGE_SELECTION_MEMORY_ENABLED:true}
minikun.knowledge-selection.search.enabled=${MINIKUN_KNOWLEDGE_SELECTION_SEARCH_ENABLED:true}
minikun.diagnostics.conversational.enabled=${MINIKUN_DIAGNOSTICS_CONVERSATIONAL_ENABLED:true}
minikun.browser.enabled=${MINIKUN_BROWSER_ENABLED:true}
minikun.tools.enabled=${MINIKUN_TOOLS_ENABLED:true}
minikun.time.default-zone=${MINIKUN_TIME_DEFAULT_ZONE:Asia/Bangkok}
minikun.token-budget.dynamic-enabled=${MINIKUN_TOKEN_BUDGET_DYNAMIC_ENABLED:true}
minikun.token-budget.reserved-output-tokens=${MINIKUN_TOKEN_BUDGET_RESERVED_OUTPUT_TOKENS:256}
minikun.context-budget.characters=${MINIKUN_CONTEXT_BUDGET_CHARACTERS:24000}
minikun.context-budget.creative-characters=${MINIKUN_CONTEXT_BUDGET_CREATIVE_CHARACTERS:40000}
minikun.performance.fast-path.enabled=${MINIKUN_PERFORMANCE_FAST_PATH_ENABLED:true}
minikun.context.recovery.minimum-context-characters=${MINIKUN_CONTEXT_RECOVERY_MINIMUM_CHARACTERS:8000}
minikun.context.recovery.reduction-percent=${MINIKUN_CONTEXT_RECOVERY_REDUCTION_PERCENT:75}
minikun.memory.management.token=${MINIKUN_MEMORY_MANAGEMENT_TOKEN:}
minikun.user-model.maximum-memories=${MINIKUN_USER_MODEL_MAXIMUM_MEMORIES:20}
minikun.user-model.memory-max-age=${MINIKUN_USER_MODEL_MEMORY_MAX_AGE:365d}
minikun.user-model.preference-max-age=${MINIKUN_USER_MODEL_PREFERENCE_MAX_AGE:365d}
minikun.user-model.minimum-confidence=${MINIKUN_USER_MODEL_MINIMUM_CONFIDENCE:0.5}
minikun.model.capability.existing.context-window=${MINIKUN_EXISTING_CONTEXT_WINDOW:16384}
minikun.model.capability.existing.max-output=${MINIKUN_EXISTING_MAX_OUTPUT:4096}
minikun.model.capability.tinygrad.context-window=${MINIKUN_TINYGRAD_CONTEXT_WINDOW:16384}
minikun.model.capability.tinygrad.max-output=${MINIKUN_TINYGRAD_MAX_OUTPUT:4096}

# Vision input (OpenAI text/image_url content parts)
minikun.vision.enabled=${MINIKUN_VISION_ENABLED:true}
minikun.vision.max-images=${MINIKUN_VISION_MAX_IMAGES:3}
minikun.vision.max-image-bytes=${MINIKUN_VISION_MAX_IMAGE_BYTES:5242880}
minikun.vision.remote-url.enabled=${MINIKUN_VISION_REMOTE_URL_ENABLED:true}
minikun.vision.remote-url.allow-http=${MINIKUN_VISION_REMOTE_URL_ALLOW_HTTP:false}
minikun.vision.connect-timeout=${MINIKUN_VISION_CONNECT_TIMEOUT:PT5S}
minikun.vision.read-timeout=${MINIKUN_VISION_READ_TIMEOUT:PT15S}

# Domain
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
minikun.model.tinygrad.base-url=${MINIKUN_TINYGRAD_BASE_URL:http://localhost:8001/v1}
minikun.search.searxng.url=${MINIKUN_SEARCH_SEARXNG_URL:http://127.0.0.1:8888}
minikun.browser.worker-url=${MINIKUN_BROWSER_WORKER_URL:http://127.0.0.1:3001}
minikun.model.task.provider=${MINIKUN_MODEL_TASK_PROVIDER:ollama}
minikun.model.task.ollama.base-url=${MINIKUN_MODEL_TASK_OLLAMA_BASE_URL:http://127.0.0.1:11434}
minikun.model.task.ollama.model=${MINIKUN_MODEL_TASK_OLLAMA_MODEL:hf.co/unsloth/Qwen3-0.6B-GGUF:UD-Q4_K_XL}
minikun.model.task.ollama.timeout=${MINIKUN_MODEL_TASK_OLLAMA_TIMEOUT:PT120S}

# Application
spring.application.name=minikun_agent
server.port=${SERVER_PORT:8080}

# Management
management.endpoints.web.exposure.include=health,metrics

# Host health probe. Dependencies are an application-owned TCP allowlist, not model input.
minikun.system.health.disk-path=${MINIKUN_SYSTEM_HEALTH_DISK_PATH:/Volumes/minikun}
minikun.system.health.dependencies=${MINIKUN_SYSTEM_HEALTH_DEPENDENCIES:application=127.0.0.1:8080,postgres=127.0.0.1:5432,redis=127.0.0.1:6379,ollama=127.0.0.1:11434,searxng=127.0.0.1:8888,browser=127.0.0.1:3001}
minikun.system.health.connect-timeout=${MINIKUN_SYSTEM_HEALTH_CONNECT_TIMEOUT:500ms}
minikun.system.health.memory-warning-percent=${MINIKUN_SYSTEM_HEALTH_MEMORY_WARNING_PERCENT:85}
minikun.system.health.disk-warning-percent=${MINIKUN_SYSTEM_HEALTH_DISK_WARNING_PERCENT:90}

# Local HTTPS remains additional to the existing HTTP connector so internal probes keep working.
minikun.https.enabled=${MINIKUN_HTTPS_ENABLED:false}
minikun.https.port=${MINIKUN_HTTPS_PORT:8443}
minikun.https.keystore=${MINIKUN_HTTPS_KEYSTORE:${user.home}/Library/Application Support/Minikun/tls/minikun.p12}
minikun.https.keystore-password-file=${MINIKUN_HTTPS_KEYSTORE_PASSWORD_FILE:${user.home}/Library/Application Support/Minikun/tls/keystore-password.txt}
minikun.https.ca-certificate=${MINIKUN_HTTPS_CA_CERTIFICATE:${user.home}/Library/Application Support/Minikun/tls/minikun-local-ca.cer}

# Homelab Guardian. Log, backup, and remediation targets are fixed application-owned allowlists.
# Remediation syntax: id|description|executable|arg1;other-id|description|executable|arg1
# Keep actions empty until an exact local service command has been reviewed and configured.
minikun.guardian.enabled=true
minikun.guardian.logs.sources=application=logs/application.log
minikun.guardian.backups.targets=
minikun.guardian.backups.maximum-age=36h
minikun.guardian.actions=
minikun.guardian.action-timeout=30s
minikun.guardian.monitor.enabled=true
minikun.guardian.monitor.poll-interval-ms=60000
minikun.guardian.monitor.failure-threshold=2
minikun.guardian.monitor.repeat-cooldown=6h

# Local Computer Agent. Every path is relative to one fixed named root.
minikun.computer.enabled=true
minikun.computer.roots=minikun=/Volumes/minikun,minikun-data=/Volumes/minikun-data,downloads=${user.home}/Downloads
minikun.computer.max-read-bytes=65536
minikun.computer.max-write-bytes=65536
minikun.computer.max-depth=6
minikun.computer.max-scanned-files=1000
minikun.computer.command-timeout=15s
minikun.computer.applications=Finder,Safari,TextEdit,Preview
minikun.computer.workflows=

# Voice Companion. Audio stays local and temporary; no recording or transcript is retained by this layer.
minikun.voice.enabled=true
minikun.voice.stt.python=${user.home}/Library/Application Support/Minikun/python/voice-venv/bin/python
minikun.voice.stt.script=${user.home}/Library/Application Support/Minikun/python/voice/whisper_transcribe.py
minikun.voice.stt.model-path=${user.home}/Library/Application Support/Minikun/models/whisper-large-v3-turbo-q4
minikun.voice.stt.model=mlx-community/whisper-large-v3-turbo-q4
minikun.voice.stt.afconvert=/usr/bin/afconvert
minikun.voice.stt.conversion-timeout=30s
minikun.voice.stt.timeout=180s
minikun.voice.tts.say=/usr/bin/say
minikun.voice.tts.timeout=30s
minikun.voice.voices=minikun=Kanya,kanya=Kanya
minikun.voice.default-voice=minikun
minikun.voice.max-input-bytes=10485760
minikun.voice.max-output-bytes=8388608
minikun.voice.max-text-characters=4000
minikun.voice.max-prompt-characters=500
minikun.voice.max-concurrent-transcriptions=1
minikun.voice.max-concurrent-syntheses=2
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Personal Knowledge. Only relative UTF-8 text files inside these named roots can be indexed.
minikun.personal-knowledge.enabled=true
minikun.personal-knowledge.roots=knowledge=${user.home}/Documents/Minikun Knowledge
minikun.personal-knowledge.owner-id=default
minikun.personal-knowledge.max-file-bytes=2097152
minikun.personal-knowledge.max-files=500
minikun.personal-knowledge.max-depth=8
minikun.personal-knowledge.chunk.characters=1200
minikun.personal-knowledge.chunk.overlap=160
minikun.personal-knowledge.retrieval.max-candidates=2000
minikun.personal-knowledge.retrieval.minimum-score=0.65
minikun.personal-knowledge.auto-recall-limit=5
minikun.personal-knowledge.semantic.weight=0.85
minikun.personal-knowledge.monitor.enabled=true
minikun.personal-knowledge.monitor.initial-delay-ms=120000
minikun.personal-knowledge.monitor.poll-interval-ms=300000
minikun.personal-knowledge.management.token=${MINIKUN_KNOWLEDGE_MANAGEMENT_TOKEN:${MINIKUN_MEMORY_MANAGEMENT_TOKEN:}}

# Adaptive Companion learns only bounded response-style defaults. It stores
# aggregated evidence and never stores raw chat messages.
minikun.adaptation.enabled=true
minikun.adaptation.minimum-observations=3
minikun.adaptation.minimum-score=0.6
minikun.adaptation.evidence-max-age=365d
minikun.adaptation.management.token=${MINIKUN_ADAPTATION_MANAGEMENT_TOKEN:${MINIKUN_MEMORY_MANAGEMENT_TOKEN:}}

# Draft-only Communication Assistant. It uses the active local chat model and
# never stores, sends, or publishes generated content.
minikun.communication.enabled=true
minikun.communication.max-input-characters=12000
minikun.communication.max-output-characters=16000
minikun.communication.max-output-tokens=1600
minikun.communication.management.token=${MINIKUN_COMMUNICATION_MANAGEMENT_TOKEN:${MINIKUN_MEMORY_MANAGEMENT_TOKEN:}}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/minikun}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:minikun}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# SQL initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:memory-schema.sql,classpath:planner-schema.sql,classpath:personal-knowledge-schema.sql,classpath:investment-schema.sql,classpath:personal-loop-schema.sql

# Closed-loop personal agent: weekly review, outcomes, experiments, inbox,
# automations, incident correlation, explainability, and personal timeline.
minikun.personal-loop.enabled=${MINIKUN_PERSONAL_LOOP_ENABLED:true}
minikun.personal-loop.owner-id=${MINIKUN_PERSONAL_LOOP_OWNER_ID:default}
minikun.personal-loop.timezone=${MINIKUN_PERSONAL_LOOP_TIMEZONE:Asia/Bangkok}
minikun.personal-loop.weekly-review.enabled=${MINIKUN_WEEKLY_REVIEW_ENABLED:true}
minikun.personal-loop.weekly-review.day=${MINIKUN_WEEKLY_REVIEW_DAY:SUNDAY}
minikun.personal-loop.weekly-review.time=${MINIKUN_WEEKLY_REVIEW_TIME:19:00}
minikun.personal-loop.automation.enabled=${MINIKUN_AUTOMATION_ENABLED:true}
minikun.personal-loop.automation.poll-interval-ms=${MINIKUN_AUTOMATION_POLL_INTERVAL_MS:60000}
minikun.personal-loop.incident.enabled=${MINIKUN_INCIDENT_COMMANDER_ENABLED:true}
minikun.personal-loop.incident.poll-interval-ms=${MINIKUN_INCIDENT_POLL_INTERVAL_MS:60000}
minikun.personal-loop.management.token=${MINIKUN_PERSONAL_LOOP_TOKEN:${MINIKUN_MEMORY_MANAGEMENT_TOKEN:}}

# Owner-scoped investment ledger and decision journal. Phase one is single-currency,
# cost-basis only, and never submits brokerage orders.
minikun.investment.enabled=${MINIKUN_INVESTMENT_ENABLED:true}
minikun.investment.default-base-currency=${MINIKUN_INVESTMENT_DEFAULT_BASE_CURRENCY:THB}

# Spring AI chat memory
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.ai.chat.memory.max-messages=${SPRING_AI_CHAT_MEMORY_MAX_MESSAGES:20}

# Persistent rolling summary for turns older than the recent verbatim window.
minikun.conversation-summary.enabled=${MINIKUN_CONVERSATION_SUMMARY_ENABLED:true}
minikun.conversation-summary.minimum-history-messages=${MINIKUN_CONVERSATION_SUMMARY_MINIMUM_HISTORY_MESSAGES:10}
minikun.conversation-summary.retain-recent-messages=${MINIKUN_CONVERSATION_SUMMARY_RETAIN_RECENT_MESSAGES:8}
minikun.conversation-summary.max-characters=${MINIKUN_CONVERSATION_SUMMARY_MAX_CHARACTERS:1800}
minikun.conversation-summary.max-output-tokens=${MINIKUN_CONVERSATION_SUMMARY_MAX_OUTPUT_TOKENS:384}
minikun.conversation-summary.max-tracked-fingerprints=${MINIKUN_CONVERSATION_SUMMARY_MAX_TRACKED_FINGERPRINTS:128}
minikun.conversation-summary.queue-capacity=${MINIKUN_CONVERSATION_SUMMARY_QUEUE_CAPACITY:16}
minikun.conversation-summary.management.token=${MINIKUN_CONVERSATION_SUMMARY_MANAGEMENT_TOKEN:${MINIKUN_MEMORY_MANAGEMENT_TOKEN:}}

# Memory
minikun.memory.minimum-confidence=${MINIKUN_MEMORY_MINIMUM_CONFIDENCE:0.7}
minikun.memory.maximum-content-length=${MINIKUN_MEMORY_MAXIMUM_CONTENT_LENGTH:500}
minikun.memory.recall.maximum-count=${MINIKUN_MEMORY_RECALL_MAXIMUM_COUNT:10}
minikun.memory.recall.maximum-characters=${MINIKUN_MEMORY_RECALL_MAXIMUM_CHARACTERS:4000}
minikun.memory.retrieval.max-candidates=${MINIKUN_MEMORY_RETRIEVAL_MAX_CANDIDATES:${MINIKUN_MEMORY_RECALL_MAXIMUM_COUNT:10}}
minikun.memory.main-model.timeout=${MINIKUN_MEMORY_MAIN_MODEL_TIMEOUT:240s}
minikun.memory.model=${MINIKUN_MEMORY_MODEL:${OLLAMA_MODEL:hf.co/mradermacher/llama3.2-typhoon2-3b-GGUF:Q4_K_M}}
minikun.memory.reflection.connect-timeout=${MINIKUN_MEMORY_REFLECTION_CONNECT_TIMEOUT:PT5S}
minikun.memory.reflection.read-timeout=${MINIKUN_MEMORY_REFLECTION_READ_TIMEOUT:PT120S}
minikun.memory.semantic.enabled=${MINIKUN_MEMORY_SEMANTIC_ENABLED:true}
minikun.memory.semantic.weight=${MINIKUN_MEMORY_SEMANTIC_WEIGHT:0.85}

# Ollama
spring.ai.ollama.chat.options.model=${SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL:hf.co/llmfan46/gemma-4-E2B-it-ultra-uncensored-heretic-GGUF:Q8_0}
spring.ai.ollama.chat.options.num-ctx=${OLLAMA_NUM_CTX:16384}
spring.ai.ollama.embedding.options.model=${EMBEDDING_MODEL:qwen3-embedding:0.6b}

# tinygrad
## existing or tinygrad
minikun.model.active=${MINIKUN_MODEL_ACTIVE:existing}
minikun.model.tinygrad.model=${MINIKUN_TINYGRAD_MODEL:Qwen3.6}
minikun.model.tinygrad.timeout=${MINIKUN_TINYGRAD_TIMEOUT:PT300S}
minikun.model.cooperation.enabled=${MINIKUN_MODEL_COOPERATION_ENABLED:true}
minikun.model.cooperation.mode=${MINIKUN_MODEL_COOPERATION_MODE:hybrid}
minikun.model.cooperation.timeout=${MINIKUN_MODEL_COOPERATION_TIMEOUT:PT300S}
minikun.model.cooperation.max-draft-characters=${MINIKUN_MODEL_COOPERATION_MAX_DRAFT_CHARACTERS:12000}
minikun.model.cooperation.quality-gate.enabled=${MINIKUN_MODEL_COOPERATION_QUALITY_GATE_ENABLED:true}
minikun.model.cooperation.quality-gate.max-memory-utilization=${MINIKUN_MODEL_COOPERATION_QUALITY_GATE_MAX_MEMORY_UTILIZATION:0.85}
minikun.model.cooperation.quality-gate.arithmetic-tolerance=${MINIKUN_MODEL_COOPERATION_QUALITY_GATE_ARITHMETIC_TOLERANCE:0.08}
minikun.model.generation.temperature=${MINIKUN_MODEL_GENERATION_TEMPERATURE:0.7}
minikun.model.generation.max-tokens=${MINIKUN_MODEL_GENERATION_MAX_TOKENS:4096}
minikun.model.generation.profiles.enabled=${MINIKUN_GENERATION_PROFILES_ENABLED:true}
minikun.model.generation.profiles.companion-max-tokens=${MINIKUN_GENERATION_COMPANION_MAX_TOKENS:384}
minikun.model.generation.profiles.focus-max-tokens=${MINIKUN_GENERATION_FOCUS_MAX_TOKENS:512}
minikun.model.generation.profiles.general-max-tokens=${MINIKUN_GENERATION_GENERAL_MAX_TOKENS:768}
minikun.model.generation.profiles.work-max-tokens=${MINIKUN_GENERATION_WORK_MAX_TOKENS:1536}
minikun.model.generation.profiles.technical-max-tokens=${MINIKUN_GENERATION_TECHNICAL_MAX_TOKENS:2048}
minikun.model.generation.profiles.creative-max-tokens=${MINIKUN_GENERATION_CREATIVE_MAX_TOKENS:4096}
minikun.model.generation.creative-continuation.enabled=${MINIKUN_CREATIVE_CONTINUATION_ENABLED:true}
minikun.model.generation.creative-continuation.tail-characters=${MINIKUN_CREATIVE_CONTINUATION_TAIL_CHARACTERS:12000}
minikun.model.generation.creative-continuation.max-tokens=${MINIKUN_CREATIVE_CONTINUATION_MAX_TOKENS:1024}

# Conversation-scoped interaction modes: companion, work and focus.
minikun.companion-mode.enabled=${MINIKUN_COMPANION_MODE_ENABLED:true}
minikun.companion-mode.maximum-sessions=${MINIKUN_COMPANION_MODE_MAXIMUM_SESSIONS:1000}

# Multi-step agent planning and persistent tool execution state.
minikun.agent.execution.enabled=${MINIKUN_AGENT_EXECUTION_ENABLED:true}
minikun.agent.execution.max-planned-steps=${MINIKUN_AGENT_MAX_PLANNED_STEPS:8}
minikun.agent.execution.max-tool-steps=${MINIKUN_AGENT_MAX_TOOL_STEPS:12}
minikun.agent.execution.max-tool-continuations=${MINIKUN_AGENT_MAX_TOOL_CONTINUATIONS:8}
minikun.agent.execution.max-retries=${MINIKUN_AGENT_MAX_RETRIES:1}
minikun.agent.execution.max-objective-characters=${MINIKUN_AGENT_MAX_OBJECTIVE_CHARACTERS:2000}
minikun.agent.execution.management.token=${MINIKUN_AGENT_MANAGEMENT_TOKEN:${MINIKUN_TASK_MANAGEMENT_TOKEN:${MINIKUN_MEMORY_MANAGEMENT_TOKEN:}}}

# Title generation task model
minikun.model.title.provider=${MINIKUN_MODEL_TITLE_PROVIDER:ollama}

# Search
minikun.search.searxng.timeout=${MINIKUN_SEARCH_SEARXNG_TIMEOUT:10s}
minikun.search.max-retries=${MINIKUN_SEARCH_MAX_RETRIES:1}
minikun.search.parallel-queries.enabled=${MINIKUN_SEARCH_PARALLEL_QUERIES_ENABLED:true}
minikun.search.parallel-queries.max-concurrency=${MINIKUN_SEARCH_PARALLEL_QUERIES_MAX_CONCURRENCY:3}
minikun.search.timeout=${MINIKUN_SEARCH_TIMEOUT:10s}
minikun.search.maximum-characters=${MINIKUN_SEARCH_MAXIMUM_CHARACTERS:4000}
minikun.search.result-limit=${MINIKUN_SEARCH_RESULT_LIMIT:8}
minikun.search.cache.ttl=${MINIKUN_SEARCH_CACHE_TTL:PT5M}
minikun.search.safesearch=${MINIKUN_SEARCH_SAFESEARCH:false}
minikun.search.query-planning.enabled=${MINIKUN_SEARCH_QUERY_PLANNING_ENABLED:true}
minikun.search.query-planning.max-alternates=${MINIKUN_SEARCH_QUERY_PLANNING_MAX_ALTERNATES:2}
minikun.search.cache.provider-version=${MINIKUN_SEARCH_CACHE_PROVIDER_VERSION:v2}

# Research synthesis
minikun.research.source-read-limit=${MINIKUN_RESEARCH_SOURCE_READ_LIMIT:3}
minikun.research.autonomous.enabled=${MINIKUN_RESEARCH_AUTONOMOUS_ENABLED:true}
minikun.research.autonomous.max-iterations=${MINIKUN_RESEARCH_AUTONOMOUS_MAX_ITERATIONS:3}
minikun.research.autonomous.max-queries=${MINIKUN_RESEARCH_AUTONOMOUS_MAX_QUERIES:8}
minikun.research.autonomous.max-follow-up-queries=${MINIKUN_RESEARCH_AUTONOMOUS_MAX_FOLLOW_UP_QUERIES:3}
minikun.research.autonomous.evaluation-max-characters=${MINIKUN_RESEARCH_AUTONOMOUS_EVALUATION_MAX_CHARACTERS:12000}
minikun.research.autonomous.timeout=${MINIKUN_RESEARCH_AUTONOMOUS_TIMEOUT:PT60S}

# Search providers
minikun.search.tavily.enabled=${MINIKUN_SEARCH_TAVILY_ENABLED:true}
minikun.search.tavily.api-key=${MINIKUN_SEARCH_TAVILY_API_KEY:}
minikun.search.tavily.url=${MINIKUN_SEARCH_TAVILY_URL:https://api.tavily.com}
minikun.search.tavily.timeout=${MINIKUN_SEARCH_TAVILY_TIMEOUT:10s}
minikun.search.tavily.search-depth=${MINIKUN_SEARCH_TAVILY_SEARCH_DEPTH:basic}
minikun.search.failover.enabled=${MINIKUN_SEARCH_FAILOVER_ENABLED:true}
minikun.search.failover.cooldown=${MINIKUN_SEARCH_FAILOVER_COOLDOWN:PT120S}
minikun.search.failover.failure-threshold=${MINIKUN_SEARCH_FAILOVER_FAILURE_THRESHOLD:3}

# Search decision
minikun.search.decision.mode=${MINIKUN_SEARCH_DECISION_MODE:llm}
minikun.search.decision.connect-timeout=${MINIKUN_SEARCH_DECISION_CONNECT_TIMEOUT:PT5S}
minikun.search.decision.read-timeout=${MINIKUN_SEARCH_DECISION_READ_TIMEOUT:PT120S}
minikun.search.decision.timeout=${MINIKUN_SEARCH_DECISION_TIMEOUT:PT15S}

# Knowledge ranking, relevance, and selection
minikun.knowledge-relevance.minimum-score=${MINIKUN_KNOWLEDGE_RELEVANCE_MINIMUM_SCORE:0.0}
minikun.knowledge-selection.memory.max-candidates=${MINIKUN_KNOWLEDGE_SELECTION_MEMORY_MAX_CANDIDATES:2147483647}
minikun.knowledge-selection.memory.max-characters=${MINIKUN_KNOWLEDGE_SELECTION_MEMORY_MAX_CHARACTERS:2147483647}
minikun.knowledge-selection.search.max-candidates=${MINIKUN_KNOWLEDGE_SELECTION_SEARCH_MAX_CANDIDATES:2147483647}
minikun.knowledge-selection.search.max-characters=${MINIKUN_KNOWLEDGE_SELECTION_SEARCH_MAX_CHARACTERS:2147483647}
minikun.knowledge-selection.browser.enabled=${MINIKUN_KNOWLEDGE_SELECTION_BROWSER_ENABLED:true}
minikun.knowledge-selection.browser.max-candidates=${MINIKUN_KNOWLEDGE_SELECTION_BROWSER_MAX_CANDIDATES:5}
minikun.knowledge-selection.browser.max-characters=${MINIKUN_KNOWLEDGE_SELECTION_BROWSER_MAX_CHARACTERS:24000}
minikun.knowledge-selection.personal.enabled=true
minikun.knowledge-selection.personal.max-candidates=5
minikun.knowledge-selection.personal.max-characters=8000

# Runtime cache
minikun.runtime.cache.backend=${MINIKUN_CACHE_BACKEND:valkey}

# Browser
minikun.browser.worker-token=${MINIKUN_BROWSER_WORKER_TOKEN:}
minikun.browser.timeout=${MINIKUN_BROWSER_TIMEOUT:20s}
minikun.browser.max-urls=${MINIKUN_BROWSER_MAX_URLS:5}
minikun.browser.block-private-addresses=${MINIKUN_BROWSER_BLOCK_PRIVATE_ADDRESSES:true}
minikun.browser.max-content-characters=${MINIKUN_BROWSER_MAX_CONTENT_CHARACTERS:12000}
minikun.browser.max-concurrency=${MINIKUN_BROWSER_MAX_CONCURRENCY:3}

# Weather capability
minikun.weather.enabled=${MINIKUN_WEATHER_ENABLED:true}
minikun.weather.geocoding-url=${MINIKUN_WEATHER_GEOCODING_URL:https://geocoding-api.open-meteo.com}
