minikun.voice.stt.model=mlx-community/whisper-large-v3-turbo-q4
minikun.voice.stt.afconvert=/usr/bin/afconvert
minikun.voice.stt.conversion-timeout=30s
minikun.voice.stt.timeout=180s
# Thai TTS runs in its own Python 3.12 environment on the external drive.
minikun.voice.tts.provider=${MINIKUN_VOICE_TTS_PROVIDER:vaniratts}
minikun.voice.tts.python=/Volumes/minikun/homelab/tts/venv/bin/python
minikun.voice.tts.working-directory=/Volumes/minikun/homelab/tts/siangtts
