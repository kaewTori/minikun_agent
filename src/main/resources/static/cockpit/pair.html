<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07100c">
  <title>เชื่อมต่อกับ Minikun</title>
  <link rel="icon" href="/cockpit/minikun-avatar.jpg">
  <style>
    :root{color-scheme:dark;font-family:"Noto Sans Thai",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#050806;color:#e8f2ec}
    *{box-sizing:border-box}body{min-height:100dvh;margin:0;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:radial-gradient(circle at 50% 0,rgba(57,229,140,.16),transparent 38%),#050806}
    main{width:min(430px,100%);padding:26px;border:1px solid #223b2d;border-radius:26px;background:rgba(11,17,14,.96);box-shadow:0 25px 80px rgba(0,0,0,.45)}
    img{width:72px;height:72px;object-fit:cover;border:1px solid #326448;border-radius:24px}p{color:#8b9b92;line-height:1.65}h1{margin:16px 0 6px;font-size:25px}label{display:grid;gap:7px;margin-top:18px;color:#b9c8bf;font-size:14px}input{width:100%;min-height:48px;padding:0 13px;border:1px solid #294233;border-radius:13px;background:#080d0a;color:#e8f2ec;font-size:16px;outline:0}input:focus{border-color:#39e58c;box-shadow:0 0 0 3px rgba(57,229,140,.08)}button{width:100%;min-height:50px;margin-top:18px;border:0;border-radius:14px;background:#39e58c;color:#031108;font-size:16px;font-weight:800}button:disabled{opacity:.45}.status{min-height:24px;margin:13px 0 0;color:#8b9b92;font-size:13px}.status.error{color:#ff9a95}.secure{display:flex;align-items:center;gap:7px;margin-top:16px;color:#6f8a7b;font-size:12px}.secure i{width:7px;height:7px;border-radius:50%;background:#39e58c}
  </style>
  <style>
    :root{--pair-bg:#07100c;--pair-surface:#0d1914;--pair-line:#203b2f;--pair-mint:#8be0b6;--pair-muted:#a1b5aa}
    body{color:#eff8f3;background:radial-gradient(circle at 78% -12%,rgba(184,206,221,.05),transparent 28rem),radial-gradient(circle at 40% 0,rgba(139,224,182,.045),transparent 24rem),var(--pair-bg);font-family:"Noto Sans Thai","Leelawadee UI",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{border-color:var(--pair-line);border-radius:24px;background:linear-gradient(145deg,rgba(16,31,24,.97),rgba(9,19,14,.99));box-shadow:0 20px 60px rgba(0,0,0,.28)}
    img{border-color:rgba(139,224,182,.42);border-radius:16px}
    h1{font-size:24px;letter-spacing:-.03em}p{color:var(--pair-muted)}label{color:var(--pair-muted)}input{border-color:var(--pair-line);border-radius:11px;background:rgba(3,10,7,.66)}input:focus{border-color:var(--pair-mint);box-shadow:0 0 0 3px rgba(139,224,182,.08)}button{border:1px solid var(--pair-mint);border-radius:11px;background:var(--pair-mint);font:700 15px/1.2 "Noto Sans Thai","Leelawadee UI",Inter,sans-serif}.secure i{background:var(--pair-mint)}
  </style>
  <link rel="stylesheet" href="/cockpit/minikun-minimal.css?v=20260924-settings">
</head>
<body>
  <main>
    <img src="/cockpit/minikun-avatar.jpg" alt="มินิคุง">
    <h1>เชื่อมต่ออุปกรณ์นี้</h1>
    <p>ยืนยันเพียงครั้งเดียว แล้วบทสนทนาจะตามมาที่อุปกรณ์นี้โดยไม่ต้องสร้างบัญชีหรือจำรหัสผ่านครับ</p>
    <form id="pair-form">
      <label>ชื่ออุปกรณ์<input id="device-name" maxlength="120" autocomplete="off" required></label>
      <label>รหัสจับคู่<input id="pair-code" maxlength="9" inputmode="text" autocapitalize="characters" autocomplete="one-time-code" required></label>
      <button id="pair-button" type="submit">เชื่อมต่อกับมินิคุง</button>
      <p class="status" id="pair-status" role="status"></p>
    </form>
    <div class="secure"><i></i> รหัสนี้ใช้ได้ครั้งเดียวและหมดอายุภายใน 2 นาที</div>
  </main>
  <script>
    (() => {
      const code = new URLSearchParams(location.search).get("code") || "";
      const codeInput = document.querySelector("#pair-code");
      const nameInput = document.querySelector("#device-name");
      const status = document.querySelector("#pair-status");
      const button = document.querySelector("#pair-button");
      codeInput.value = code;
      nameInput.value = /iPhone/i.test(navigator.userAgent) ? "iPhone" : /iPad/i.test(navigator.userAgent) ? "iPad" : "อุปกรณ์ใหม่";
      document.querySelector("#pair-form").addEventListener("submit", async (event) => {
        event.preventDefault(); button.disabled = true; status.className = "status"; status.textContent = "กำลังเชื่อมต่อ…";
        try {
          const response = await fetch("/v1/sync/pairings/claim", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({code:codeInput.value, deviceName:nameInput.value})});
          if (!response.ok) { const body = await response.json().catch(() => ({})); throw new Error(body.detail || body.message || "เชื่อมต่อไม่สำเร็จ"); }
          status.textContent = "เชื่อมต่อแล้ว กำลังเปิดแชต…";
          location.replace("/cockpit/");
        } catch (error) { status.className = "status error"; status.textContent = error.message; button.disabled = false; }
      });
    })();
  </script>
</body>
</html>
